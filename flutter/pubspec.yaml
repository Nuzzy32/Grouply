name: grouply
description: Grouply — ruang kerja kelompok untuk Android dan iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.12.4
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  cupertino_icons: ^1.0.9
  share_plus: ^13.3.1
