<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#F8F9F7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
		/>
		<!-- Hanya ikon yang dipakai (urut abjad, syarat icon_names). Tambah nama di sini saat memakai ikon baru. -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&icon_names=add,add_task,android,arrow_forward,arrow_upward,autorenew,chat_bubble,check_circle,chevron_left,chevron_right,database,error,group,home,interests,laptop_mac,link,lock,pause,phone_iphone,play_arrow,radio_button_unchecked,rate_review,remove,replay,schedule,task_alt,undo,upload,visibility&display=block"
		/>
		<!-- Animasi reveal hanya menyembunyikan konten bila JS jalan. -->
		<script>
			document.documentElement.classList.add('js');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
