name: Grouply
options:
  bundleIdPrefix: id.grouply
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Grouply:
    type: application
    platform: iOS
    sources: [Grouply]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: Grouply/Resources/Grouply.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        application-identifier: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)]
    info:
      path: Grouply/Resources/Info.plist
      properties:
        CFBundleDisplayName: Grouply
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: id.grouply.demo
            CFBundleURLSchemes: [grouply]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.grouply.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GrouplyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrouplyTests]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - target: Grouply
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GrouplyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GrouplyUITests]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - target: Grouply
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Grouply:
    build:
      targets:
        Grouply: all
    test:
      targets: [GrouplyTests, GrouplyUITests]
      environmentVariables:
        GROUPLY_LOCAL_ACCOUNTS_PATH: $(GROUPLY_LOCAL_ACCOUNTS_PATH)
